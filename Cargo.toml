[package]
name = "en3-recovery"
version = "0.0.1"
edition = "2024"
description = "Shared local core for Guanhai Bafen and legacy EN3 recovery"
license = "MIT"

[dependencies]
aes-gcm = "0.11.1"
argon2 = "0.6.0"
encoding_rs = "0.8.44"
getrandom = "0.4.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sm3 = { version = "0.5.0", default-features = false }
sm4 = "0.6.0"
tempfile = "3"
walkdir = "2"
zeroize = "1.9.2"
zip = { version = "2.4", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3.9", features = [
  "basetsd",
  "commctrl",
  "commdlg",
  "libloaderapi",
  "minwindef",
  "shellapi",
  "shlobj",
  "windef",
  "wingdi",
  "winuser",
] }

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
panic = "abort"
