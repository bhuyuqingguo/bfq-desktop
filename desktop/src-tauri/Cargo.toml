[package]
name = "bfq-desktop"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
description = "Lightweight desktop client for BFQ encrypted archives"
license = "MIT"

[lib]
name = "bfq_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
en3-recovery = { path = "../.." }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
panic = "abort"
