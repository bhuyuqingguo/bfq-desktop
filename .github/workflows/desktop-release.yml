name: Desktop build and release

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  core-tests:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - name: Run Rust core tests
        run: cargo test --locked

  build:
    needs: core-tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            kind: windows
          - name: linux-x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            kind: linux
          - name: macos-x64
            os: macos-latest
            target: x86_64-apple-darwin
            kind: macos
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            kind: macos

    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install Linux build dependencies
        if: matrix.kind == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            wget

      - name: Install Rust target
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add "${{ matrix.target }}"

      - name: Install frontend dependencies
        run: npm ci

      - name: Check desktop Rust code
        if: matrix.kind == 'linux'
        working-directory: desktop/src-tauri
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --target "${{ matrix.target }}" --all-targets -- -D warnings

      - name: Build Windows executable
        if: matrix.kind == 'windows'
        run: npm run tauri -- build --no-bundle --target "${{ matrix.target }}"

      - name: Build Linux executable and Debian package
        if: matrix.kind == 'linux'
        run: npm run tauri -- build --bundles deb --target "${{ matrix.target }}"

      - name: Build macOS application
        if: matrix.kind == 'macos'
        run: npm run tauri -- build --bundles app --target "${{ matrix.target }}"

      - name: Build shared core for application integration
        working-directory: .
        run: cargo build --locked --release --target "${{ matrix.target }}" --bin guanhai-core

      - name: Collect Windows artifact
        if: matrix.kind == 'windows'
        run: |
          New-Item -ItemType Directory -Path release -Force | Out-Null
          Copy-Item "src-tauri/target/${{ matrix.target }}/release/bfq-desktop.exe" "release/guanhai-bafen-windows-x64.exe"
          Copy-Item "../target/${{ matrix.target }}/release/guanhai-core.exe" "release/guanhai-core-windows-x64.exe"

      - name: Collect Linux artifacts
        if: matrix.kind == 'linux'
        run: |
          mkdir -p release
          cp "src-tauri/target/${{ matrix.target }}/release/bfq-desktop" "release/guanhai-bafen-linux-x64"
          tar -C "src-tauri/target/${{ matrix.target }}/release" -czf "release/guanhai-bafen-linux-x64.tar.gz" bfq-desktop
          find "src-tauri/target/${{ matrix.target }}/release/bundle/deb" -maxdepth 1 -name '*.deb' -exec cp {} "release/guanhai-bafen-linux-x64.deb" \;
          cp "../target/${{ matrix.target }}/release/guanhai-core" "release/guanhai-core-linux-x64"
          tar -C release -czf "release/guanhai-core-linux-x64.tar.gz" guanhai-core-linux-x64
          rm "release/guanhai-core-linux-x64"

      - name: Collect macOS artifact
        if: matrix.kind == 'macos'
        run: |
          mkdir -p release
          app_path=$(find "src-tauri/target/${{ matrix.target }}/release/bundle/macos" -maxdepth 1 -name '*.app' -print -quit)
          test -n "$app_path"
          ditto -c -k --sequesterRsrc --keepParent "$app_path" "release/guanhai-bafen-${{ matrix.name }}.zip"
          cp "../target/${{ matrix.target }}/release/guanhai-core" "release/guanhai-core-${{ matrix.name }}"
          tar -C release -czf "release/guanhai-core-${{ matrix.name }}.tar.gz" "guanhai-core-${{ matrix.name }}"
          rm "release/guanhai-core-${{ matrix.name }}"

      - uses: actions/upload-artifact@v7
        with:
          name: guanhai-bafen-${{ matrix.name }}
          path: desktop/release/*
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          path: release
          merge-multiple: true

      - name: Generate SHA-256 checksums
        run: |
          cd release
          sha256sum * > SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" release/* --generate-notes --verify-tag
