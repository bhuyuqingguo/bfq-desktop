name: Run cargo fmt
on:
  workflow_dispatch:
jobs:
  fmt:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Refresh src-tauri lock file
        run: cargo update --manifest-path desktop/src-tauri/Cargo.toml --workspace
      - name: Format code
        run: cargo fmt --all
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "no changes" || git commit -m "Refresh src-tauri lock file and apply cargo fmt" && git push
